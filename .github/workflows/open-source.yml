name: Update Open Source cards

on:
  schedule:
    - cron: "17 0 * * *" # 08:17 Asia/Shanghai
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_open_source.py
      - scripts/check_open_source.py
      - .github/workflows/open-source.yml

permissions:
  contents: write

concurrency:
  group: open-source-cards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check card generation
        run: python3 scripts/check_open_source.py
      - name: Generate light and dark cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_open_source.py
      - name: Commit updated cards
        run: |
          git add assets/open-source.svg assets/open-source-dark.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update open source contributions"
          git push
